# EB-TCM 客户端（fronted/dist）nginx 站点配置
# 用法：把 dist/ 上传到 root 指向的目录，后端以 --env=prod 跑在 127.0.0.1:7099
# 宝塔：网站 → 设置 → 配置文件，把 server {} 内的 location 部分粘进去即可

server {
    listen 80;
    server_name _;                       # 换成域名或服务器 IP

    root /www/wwwroot/ebtcm/dist;        # dist 上传后的目录
    index index.html;

    # 静态资源开启 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带 hash 的打包资源可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用：所有前端路由回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：前端请求 /api/xxx，去掉 /api 前缀后转发给 FastAPI
    # 注意 proxy_pass 末尾的斜杠不能少，少了前缀不会被去掉
    location /api/ {
        proxy_pass http://127.0.0.1:7099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # 检索、导出 PDF 可能较慢
        proxy_buffering off;              # PDF 原文边读边传
    }
}
